{% extends "layout.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<!-- Background -->
<div class="flex items-center justify-center bg-[linear-gradient(90deg, #0a0a0a, #1c1c1c))] text-gray-200 font-inter px-4">
  
  <!-- Glass Card -->
  <div class="backdrop-blur-lg bg-white/10 border border-white/10 rounded-2xl shadow-2xl p-8 w-full max-w-lg">
    
    <h2 class="text-3xl font-extrabold text-center text-indigo-400 mb-3 drop-shadow-md">
      Add New Student
    </h2>
    <p class="text-center text-gray-400 mb-8">Enter the student details below.</p>

    <form method="POST" action="/add_students" class="space-y-6">
      <!-- Full Name -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-300">Full Name</label>
        <input type="text" name="name" required
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-100 placeholder-gray-500 transition-all duration-200"
          placeholder="Enter full name">
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-300">Email Address</label>
        <input type="email" name="email" required
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-100 placeholder-gray-500 transition-all duration-200"
          placeholder="example@gmail.com">
      </div>

      <!-- Course -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-300">Course</label>
        <select name="course" required
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-100 transition-all duration-200">
          <option value="" disabled selected>Select a course</option>
          <option value="AI">AI</option>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>
          <option value="EEE">EEE</option>
          <option value="DS">DS</option>
        </select>
      </div>

      <!-- Year -->
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-300">Year</label>
        <select name="year" required
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 outline-none text-gray-100 transition-all duration-200">
          <option value="" disabled selected>Select year</option>
          <option value="I">I</option>
          <option value="II">II</option>
          <option value="III">III</option>
          <option value="IV">IV</option>
        </select>
      </div>

      <!-- Submit Button -->
      <div class="pt-6 text-center">
        <button type="submit"
          class="w-2/3 py-3 text-lg font-semibold rounded-lg shadow-lg text-white bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-500 hover:scale-105 transition-transform duration-200">
          Add Student
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
