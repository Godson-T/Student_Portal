{% extends "layout.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="flex items-center justify-center bg-#1c1c1c">
  <div class="backdrop-blur-lg border border-cyan-500/20 shadow-2xl rounded-2xl p-8 w-full max-w-sm text-center">

    <h2 class="text-3xl font-bold text-cyan-400 mb-3">Create New Password</h2>
    <p class="text-gray-400 mb-6 text-sm">Enter a new password for your account</p>

    <form method="POST" action="/reset_password" class="text-left space-y-4">
      <!-- New Password -->
      <div>
        <label for="new_password" class="block text-gray-300 font-semibold mb-1">New Password</label>
        <input type="password" name="new_password" required
          class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm_password" class="block text-gray-300 font-semibold mb-1">Confirm Password</label>
        <input type="password" name="confirm_password" required
          class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>

      <!-- Button -->
      <button type="submit"
        class="w-full py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-lg shadow-lg hover:scale-[1.02] transition-transform">
        Reset Password
      </button>
    </form>

    {% if error %}
      <div class="mt-4 bg-red-600/10 border border-red-500/50 text-red-400 text-sm px-3 py-2 rounded-md">
        {{ error }}
      </div>
    {% endif %}

  </div>
</div>
{% endblock %}
