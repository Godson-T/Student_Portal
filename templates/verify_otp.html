{% extends "layout.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="flex items-center justify-center screen bg-#1c1c1c">
  
  <div class="bg-gray-900/60 backdrop-blur-lg border border-cyan-500/20 shadow-2xl rounded-2xl p-8 w-full max-w-sm text-center">

    <h2 class="text-3xl font-bold text-cyan-400 mb-2">Verify OTP </h2>
    <p class="text-gray-400 text-sm mb-6">Enter the OTP sent to your email</p>

    <form method="POST" action="/verify_otp" class="space-y-4">

      <div class="flex justify-center gap-2">
        <input type="text" name="otp" maxlength="6"
          class="w-full text-center text-xl tracking-widest px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-gray-100
                 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500"
          placeholder="Enter OTP"
          required>
      </div>

      <button type="submit"
        class="w-full py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold rounded-lg shadow-lg 
               hover:scale-105 transition-transform">
        Verify 
      </button>
    </form>

  </div>
</div>
{% endblock %}
