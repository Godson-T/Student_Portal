{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="flex items-center justify-center screen bg-#1c1c1c">
  <div class="bg-gray-900/70 backdrop-blur-xl border border-cyan-500/20 shadow-2xl rounded-2xl p-8 w-full max-w-md text-center">
    
    <h2 class="text-3xl font-bold text-cyan-400 mb-3">Create Account</h2>
    <p class="text-gray-400 mb-6 text-sm">Join the portal and start managing your students efficiently.</p>

    <form method="POST" action="/register" class="space-y-4 text-left">
      <!-- Username -->
      <div>
        <label class="block text-gray-300 font-semibold mb-1">Username</label>
        <input type="text" name="username" required
          class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-gray-300 font-semibold mb-1">Email</label>
        <input type="email" name="email" required
          class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>

      <!-- Password -->
      <div>
        <label class="block text-gray-300 font-semibold mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-lg shadow-lg hover:scale-[1.02] transition-transform">
        Register
      </button>
    </form>

    <p class="text-gray-400 mt-6 text-sm">
      Already have an account? 
      <a href="{{ url_for('login') }}" class="text-cyan-400 font-semibold hover:underline">Login</a>
    </p>

    {% if error_msg %}
      <div class="mt-4 bg-red-600/10 border border-red-500/50 text-red-400 text-sm px-3 py-2 rounded-md">
        {{ error_msg }}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
