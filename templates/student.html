{% extends "layout.html" %}
{% block content %}
<div class="flex items-center justify-center">

  <!-- CARD WRAPPER -->
  <div class="w-full max-w-2xl bg-[#0f172a]/60 backdrop-blur-2xl border border-cyan-400/10 rounded-3xl shadow-[0_0_50px_rgba(0,255,255,0.15)] p-10 relative overflow-hidden">

    <!-- TOP RIGHT LIGHT EFFECT -->
    <div class="absolute -top-10 -right-10 w-4 h-40 bg-cyan-500/20 rounded-full blur-3xl"></div>

    <!-- HEADER SECTION -->
    <div class="flex items-center gap-8 mb-10">
      <div class="w-24 h-24 rounded-full bg-gradient-to-br from-cyan-500 to-blue-700 flex items-center justify-center text-5xl font-extrabold text-white shadow-xl">
        {{ student.name[0] }}
      </div>
      <div>
        <h2 class="text-4xl font-bold tracking-wide text-white">{{ student.name }}</h2>
        <p class="text-gray-400 text-sm">Student Profile • Detailed View</p>
      </div>
    </div>

    <!-- DATA GRID -->
    <div class="grid sm:grid-cols-2 gap-6">

      <!-- EMAIL -->
      <div class="group p-5 rounded-xl bg-[#101e33]/70 border border-cyan-500/10 transition-all duration-300 hover:border-cyan-400/40 hover:scale-[1.03] shadow-md hover:shadow-cyan-500/20">
        <p class="text-gray-400 text-xs uppercase tracking-wider">Email</p>
        <p class="mt-2 text-xl font-semibold text-cyan-300 break-words group-hover:text-white transition-colors">
          {{ student.email }}
        </p>
      </div>

      <!-- COURSE -->
      <div class="group p-5 rounded-xl bg-[#101e33]/70 border border-cyan-500/10 transition-all duration-300 hover:border-cyan-400/40 hover:scale-[1.03] shadow-md hover:shadow-cyan-500/20">
        <p class="text-gray-400 text-xs uppercase tracking-wider">Course</p>
        <p class="mt-2 text-xl font-semibold text-cyan-300 group-hover:text-white transition-colors">
          {{ student.course }}
        </p>
      </div>

      <!-- YEAR -->
      <div class="group p-5 rounded-xl bg-[#101e33]/70 border border-cyan-500/10 transition-all duration-300 hover:border-cyan-400/40 hover:scale-[1.03] shadow-md hover:shadow-cyan-500/20">
        <p class="text-gray-400 text-xs uppercase tracking-wider">Year</p>
        <p class="mt-2 text-xl font-semibold text-cyan-300 group-hover:text-white transition-colors">
          {{ student.year }}
        </p>
      </div>

    </div>

    <!-- BUTTONS -->
    <div class="mt-12 flex flex-wrap justify-center gap-4">
      <a href="/edit/{{ student.id }}" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold hover:shadow-cyan-500/40 hover:scale-[1.08] transition-all shadow-lg">
      Edit
      </a>

      <a href="/delete/{{ student.id }}" class="px-6 py-3 rounded-xl bg-gradient-to-r from-red-600 to-red-700 text-white font-bold hover:shadow-red-500/40 hover:scale-[1.08] transition-all shadow-lg">
         Delete
      </a>

      <a href="/view_students" class="px-6 py-3 rounded-xl bg-gray-700 text-white font-bold hover:bg-gray-600 hover:scale-[1.05] transition-all shadow-md">
        ◀ Back
      </a>
    </div>

  </div>
</div>
{% endblock %}
