{% extends "layout.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6 mt-10">
  <h2 class="text-2xl font-bold mb-4 text-center">{{ student.name }}</h2>
  
  <div class="space-y-2">
    <p><span class="font-text">Email:</span> {{ student.email }}</p>
    <p><span class="font-text">Course:</span> {{ student.course }}</p>
    <p><span class="font-text-bold-black">Year:</span> {{ student.year }}</p>
  </div>

  <div class="mt-6 text-center">
    <a href="/edit/{{ student.id }}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Edit</a>
    <a href="/delete/{{ student.id }}" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 ml-2">Delete</a>
    <a href="/view_students" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 ml-2">Back</a>
  </div>
</div>
{% endblock %}
