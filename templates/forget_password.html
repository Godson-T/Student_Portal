{% extends "layout.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}

<!-- ✅ MINIMAL + PROFESSIONAL FORGOT PASSWORD SCREEN -->
<div class="flex items-center justify-center ">

  <!-- BACKGROUND AURA -->
  <div class="absolute -z-10 w-[500px] h-[600px] rounded-full bg-gradient-to-br from-cyan-600/20 to-blue-700/10 blur-3xl"></div>

  <!-- FORM AREA -->
  <div class="w-full max-w-lg text-center">

    <!-- HEADER TEXT -->
    <h2 class="text-4xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-blue-500">
      Forgot Password
    </h2>
    <p class="text-gray-400 text-sm mt-2 tracking-wide">Enter your email to receive the OTP</p>

    <!-- FORM -->
    <form method="POST" action="/forget_password" class="mt-10 space-y-6">

      <div class="text-left">
        <label class="text-gray-300 text-sm font-semibold mb-1">Email Address</label>
        <input
          type="email"
          name="email"
          placeholder="example@email.com"
          required
          class="w-full px-5 py-3 rounded-xl bg-[#0f172a] border border-cyan-500/20 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
        />
      </div>

      <!-- BUTTON -->
      <button type="submit"
        class="w-full py-3 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold tracking-wide hover:scale-[1.08] transition-all shadow-lg">
        Send OTP
      </button>
    </form>

    <!-- LOGIN LINK -->
    <p class="text-gray-400 text-sm mt-8">
      Remembered your password?
      <a href="{{ url_for('login') }}" class="text-cyan-400 hover:underline font-semibold">Login</a>
    </p>

    {% if error %}
    <div class="mt-4 bg-red-600/10 border border-red-500/40 text-red-400 text-sm px-4 py-3 rounded-md shadow-md">
      {{ error }}
    </div>
    {% endif %}

  </div>
</div>

{% endblock %}
