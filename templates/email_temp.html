<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            width: 90%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            margin: auto;
            border-radius: 12px;
            font-family: Arial, sans-serif;
            color: #444;
        }
        .header {
            text-align: center;
            color: #007AFF;
            font-size: 24px;
            font-weight: bold;
        }
        .btn {
            background: #007AFF;
            color: white;
            padding: 12px 20px;
            display: inline-block;
            text-decoration: none;
            margin-top: 20px;
            border-radius: 6px;
        }
        .footer {
            font-size: 14px;
            color: #999;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"> Welcome to Student Portal!</div>

        <p>Hello <strong>{{ student_name }}</strong>,</p>

        <p>We're excited to welcome you to <strong>Student Portal</strong>.  
        You have been successfully added to our student system under the course:</p>

        <p><strong>Course: {{ course }}</strong></p>

        <a href="{{ url_for('/login') }}" class="btn">Login to Dashboard</a>

        <p class="footer">If you have questions, reply to this email anytime.</p>
    </div>
</body>
</html>
