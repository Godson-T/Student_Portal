{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow p-4" style="width: 350px; border-radius: 15px; background-color: #1c1c1c;">
    <h3 class="text-center mb-4 text-light">Login</h3>
    <form method="POST" action="/login">
      <div class="mb-3">
        <label for="email" class="form-label text-light">Email</label>
        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label text-light">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
    </form>
    <p class="text-center mt-3 text-light">Don't have an account? <a href="{{ url_for('register') }}" class="text-info">Register</a></p>
    {% if error_msg %}
<div class="alert alert-danger mt-2 py-1 px-2" role="alert" style="font-size:0.85rem;">
  {{ error_msg }}
</div>
{% endif %}
{% endblock %}
