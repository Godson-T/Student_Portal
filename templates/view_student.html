{% extends "layout.html" %}

{% block content %}
<div class="  flex items-center justify-center p-6">
  <div class="w-full max-w-6xl bg-gray-900/60 backdrop-blur-lg rounded-2xl shadow-2xl border border-cyan-500/20 overflow-hidden">
    
    <h2 class="text-center text-3xl font-bold text-cyan-400 py-6 border-b border-gray-700">
       Student Records
    </h2>

    <!-- 🔍 Search & Filter -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-4 px-6 pt-4">
      <input id="searchInput"
             type="text"
             placeholder="Search by name or email..."
             class="w-full md:w-1/2 px-4 py-2 rounded-lg bg-gray-800 border border-cyan-500/40 
                    focus:outline-none focus:ring-2 focus:ring-cyan-500 placeholder-gray-400 text-gray-100">
      <select id="filterSelect"
              class="px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 focus:ring-2 focus:ring-cyan-500">
        <option value="all">All Courses</option>
        <option value="AI">AI</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="MECH">MECH</option>
        <option value="CIVIL">CIVIL</option>
        <option value="EEE">EEE</option>
        <option value="DS">DS</option>
      </select>
    </div>

    <!-- 🧾 Student Table -->
    <div class="overflow-x-auto px-6 pb-4">
      <table class="w-full text-left border-collapse">
        <thead class="bg-cyan-600/20 text-cyan-300 uppercase text-sm">
          <tr>
            <th class="px-6 py-3 border-b border-gray-700">ID</th>
            <th class="px-6 py-3 border-b border-gray-700">Name</th>
            <th class="px-6 py-3 border-b border-gray-700">Email</th>
            <th class="px-6 py-3 border-b border-gray-700">Course</th>
            <th class="px-6 py-3 border-b border-gray-700">Year</th>
            <th class="px-6 py-3 border-b border-gray-700 text-center">Actions</th>
          </tr>
        </thead>

        <tbody id="studentTable" class="text-gray-300">
          {% for student in students %}
          <tr class="hover:bg-gray-800/60 transition-all">
            <td class="px-6 py-3 border-b border-gray-800">{{ student.id }}</td>
            <td><a href="/student/{{ student.id }}" class="text-blue-600 hover:underline">{{ student.name }}</a></td>

            <td class="px-6 py-3 border-b border-gray-800">{{ student.email }}</td>
            <td class="px-6 py-3 border-b border-gray-800">{{ student.course }}</td>
            <td class="px-6 py-3 border-b border-gray-800">{{ student.year }}</td>
            <td class="px-6 py-3 border-b border-gray-800 text-center space-x-2">
              <a href="/edit/{{ student.id }}" 
                 class="inline-block px-3 py-1.5 text-sm font-semibold text-white rounded-md bg-blue-600 hover:bg-blue-500 hover:shadow-lg hover:shadow-blue-500/40 transition-all">
                ✏️ Edit
              </a>
              <a href="/delete/{{ student.id }}" 
                 class="inline-block px-3 py-1.5 text-sm font-semibold text-white rounded-md bg-red-600 hover:bg-red-500 hover:shadow-lg hover:shadow-red-500/40 transition-all">
                🗑️ Delete
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <!-- 📄 Pagination Footer -->
      <div class="flex justify-center items-center gap-3 mt-6 text-gray-300">
        <button id="prevBtn" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-cyan-600 disabled:opacity-50">⬅ Prev</button>
        <span id="pageIndicator" class="text-cyan-400 font-semibold"></span>
        <button id="nextBtn" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-cyan-600 disabled:opacity-50">Next ➡</button>
      </div>
    </div>
  </div>
</div>

<!-- ⚙️ JS for Search + Filter + Pagination -->
<script>
  const searchInput = document.getElementById('searchInput');
  const filterSelect = document.getElementById('filterSelect');
  const rows = Array.from(document.querySelectorAll('#studentTable tr'));
  const rowsPerPage = 10;
  let currentPage = 1;

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageIndicator = document.getElementById('pageIndicator');

  function renderTable() {
    rows.forEach((row, index) => {
      row.style.display = (index >= (currentPage - 1) * rowsPerPage && index < currentPage * rowsPerPage) ? '' : 'none';
    });
    const totalPages = Math.ceil(rows.length / rowsPerPage);
    pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
  }

  function filterTable() {
    const searchText = searchInput.value.toLowerCase();
    const courseFilter = filterSelect.value.toLowerCase();

    rows.forEach(row => {
      const name = row.children[1].textContent.toLowerCase();
      const email = row.children[2].textContent.toLowerCase();
      const course = row.children[3].textContent.toLowerCase();
      const matchesSearch = name.includes(searchText) || email.includes(searchText);
      const matchesCourse = courseFilter === 'all' || course === courseFilter;
      row.style.display = matchesSearch && matchesCourse ? '' : 'none';
    });
  }

  searchInput.addEventListener('input', filterTable);
  filterSelect.addEventListener('change', filterTable);
  prevBtn.addEventListener('click', () => { if (currentPage > 1) currentPage--; renderTable(); });
  nextBtn.addEventListener('click', () => { currentPage++; renderTable(); });

  renderTable();
</script>
{% endblock %}
