{% extends "layout.html" %}

{% block content %}
<table class="table table-dark table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Course</th>
      <th>Year</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for student in students %}
    <tr>
      <td>{{ student.id }}</td>
      <td>{{ student.name }}</td>
      <td>{{ student.email }}</td>
      <td>{{ student.course }}</td>
      <td>{{ student.year }}</td>
      <td>
        <a href="/edit/{{ student.id }}" class="btn btn-sm btn-warning">Edit</a>
        <a href="/delete/{{ student.id }}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
